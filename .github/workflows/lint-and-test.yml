name: Lint and Test

on: [pull_request, workflow_dispatch]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # Match package.json "engines" and the deploy workflows. This was
        # pinned to 16, so CI was validating a version the site is not built on.
        node-version: [20]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        env:
          SITE_NAME: "Safetag"

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

name: Build and Deploy (staging)

# Translations live in the repository under locales/ and are committed by
# Weblate, so the build is a plain `npm ci && npm run build` -- there is no
# translation API call and no token needed at build time.

on:
  workflow_dispatch:
  push:
    branches:
      - development

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: staging

    env:
      SITE_NAME: "Safetag"

    steps:
      # Cancel previous workflows to avoid overlapping deploys as content
      # editing might add several commits in short intervals.
      - name: Cancel Previous Runs
        uses: styfle/cancel-workflow-action@0.12.1
        with:
          access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout
        uses: actions/checkout@v4

      # https://github.com/aws/aws-cli/issues/1249
      - name: Fix mimetypes detection for yaml files
        run: |
          echo 'application/x-yaml yaml yml' | sudo tee -a /etc/mime.types

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install and lint
        run: |
          npm ci
          npm run lint

      - name: Build
        run: npm run build

      - name: Deploy 🚀
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avzr --delete
          path: public/
          remote_path: ${{ secrets.SSH_DIR }}
          remote_host: ${{ secrets.SSH_HOST }}
          remote_port: 22
          remote_user: ${{ secrets.SSH_USER }}
          remote_key: ${{ secrets.SSH_KEY }}

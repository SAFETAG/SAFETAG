# TEMPORARY — Weblate migration Phase 0 snapshot capture.
#
# Purpose: extract the current translations from Transifex as `locales/**` source
# files (the only authoritative store; they are gitignored and normally exist only
# transiently during a build). The uploaded artifact is both the Weblate seed and
# the diff target for the migration spike. See doc/weblate-migration.md §1a, §5.
#
# Read-only against Transifex: it generates .tx/config and PULLS only — it does NOT
# run `tx push`, so no source strings are uploaded or mutated.
#
# Delete this workflow once the snapshot has been captured and imported into Weblate.

name: Capture translations snapshot (temporary)

on:
  workflow_dispatch:

jobs:
  capture:
    runs-on: ubuntu-latest
    env:
      TX_TOKEN: ${{ secrets.TRANSIFEX_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure tx client is executable
        run: chmod +x ./tx

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps and extract UI strings (creates locales/en/site.json)
        run: |
          npm ci
          npm run extract
          echo "site.json source:" && ls -la locales/en/site.json

      - name: Generate .tx/config (resource mappings, no upload)
        run: |
          ./tx init || true
          ./transifex-sync.sh

      - name: Pull all translations from Transifex
        run: ./tx pull --all --silent

      - name: Normalize frontmatter (same postprocess the build uses)
        run: python3 src/helpers/postprocess.py

      - name: Show what was captured
        run: |
          echo "Languages:" && ls -1 locales || true
          echo "File count per language:"
          for d in locales/*/; do printf "%s  " "$d"; find "$d" -type f | wc -l; done

      - name: Upload locales snapshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: transifex-locales-snapshot
          path: locales/
          if-no-files-found: error
          retention-days: 30
